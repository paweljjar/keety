name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKEETY_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify CLI Executables
        shell: bash
        run: |
          BUILD_BIN="build/src"
          [ -d "build/src/Release" ] && BUILD_BIN="build/src/Release"
          EXE=""
          [ -f "$BUILD_BIN/keety.exe" ] && EXE=".exe"
          "$BUILD_BIN/keety$EXE" --version
          "$BUILD_BIN/kattery$EXE" --version

